<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid / pattern -->
  <circle cx="1050" cy="150" r="300" fill="#f59e0b" opacity="0.06" />
  <circle cx="150" cy="500" r="250" fill="#38bdf8" opacity="0.04" />

  <!-- Badge -->
  <rect x="100" y="90" width="460" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="120" y="117" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="1">
    GRUNDGESETZ FÜR DIE BRD • ART. 4 ABS. 3
  </text>

  <!-- Title -->
  <text x="100" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="58" font-weight="900" letter-spacing="-1">
    KDV<tspan fill="url(#gold)">antrag</tspan>.de
  </text>

  <!-- Subtitle -->
  <text x="100" y="280" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800">
    Kriegsdienstverweigerung rechtssicher stellen
  </text>

  <text x="100" y="340" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500">
    Muster-Anschreiben • Tabellarischer Lebenslauf • Leitfaden Gewissensbegründung
  </text>

  <!-- Features Boxes -->
  <rect x="100" y="410" width="300" height="120" rx="16" fill="#1e293b" stroke="#334155" />
  <text x="130" y="455" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800">
    01. STATUS-CHECK
  </text>
  <text x="130" y="490" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600">
    Ungediente, Soldaten &amp; Reservisten
  </text>

  <rect x="440" y="410" width="300" height="120" rx="16" fill="#1e293b" stroke="#334155" />
  <text x="470" y="455" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800">
    02. MUSTER-GENERATOR
  </text>
  <text x="470" y="490" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600">
    Normgerecht nach DIN 5008 &amp; KDVG
  </text>

  <rect x="780" y="410" width="320" height="120" rx="16" fill="#1e293b" stroke="#334155" />
  <text x="810" y="455" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800">
    03. FRISTENRECHNER
  </text>
  <text x="810" y="490" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600">
    § 70 VwGO &amp; § 22 Abs. 4 KDVG Schutz
  </text>

  <!-- Footer hint -->
  <text x="100" y="585" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500">
    Unabhängiges Informationsportal • 100% DSGVO-konform ohne externe Tracker
  </text>
</svg>
